stages:
  - test
  - deploy

variables:
  CACHE_COMPRESSION_FORMAT: tarzstd
  CACHE_COMPRESSION_LEVEL: fast

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  interruptible: true
  tags:
    - tournament

check_deploy:
  stage: test
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash shellcheck
  script:
    - bash -n deploy/deploy.sh deploy/release.sh
    - shellcheck deploy/deploy.sh deploy/release.sh

test_backend:
  stage: test
  image: golang:1.25-alpine
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.ci-cache/go-mod"
    GOCACHE: "$CI_PROJECT_DIR/.ci-cache/go-build"
  cache:
    - key:
        prefix: tournament-go1.25-linux-amd64-mod-v1
        files:
          - backend/go.mod
          - backend/go.sum
      paths:
        - .ci-cache/go-mod/
    - key: tournament-go1.25-linux-amd64-build-v1
      paths:
        - .ci-cache/go-build/
  before_script:
    - apk add --no-cache git gcc musl-dev
    - cd backend
    - go mod download
    - go mod verify
  script:
    - echo "Checking the Go backend"
    - go vet ./...
    - go test -v -race -count=1 ./...
    # Compile both production entry points.
    - CGO_ENABLED=0 go build -o /dev/null ./cmd/server
    - CGO_ENABLED=0 go build -o /dev/null ./cmd/migrator

test_frontend:
  stage: test
  image: denoland/deno:alpine-2.9.8
  variables:
    DENO_DIR: "$CI_PROJECT_DIR/.ci-cache/deno"
  cache:
    key:
      prefix: tournament-deno2.9.8-alpine-linux-amd64-v1
      files:
        - frontend/package.json
        - frontend/deno.lock
    paths:
      - .ci-cache/deno/
  before_script:
    - cd frontend
    - deno install --frozen
  script:
    - echo "Building the frontend with Deno"
    - deno task build

deploy_prod:
  stage: deploy
  image: alpine:3.21
  resource_group: tournament-deploy
  interruptible: false
  environment:
    name: production
    url: https://tournament.schooltech.ru
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
  before_script:
    - apk add --no-cache openssh-client git tar bash
  script:
    - echo "Deploying release ${CI_COMMIT_SHA}"
    - bash deploy/deploy.sh
