# Host nginx server block for the tournament project.
# Copy into your nginx sites (e.g., /etc/nginx/sites-available/tournament)
# and symlink into sites-enabled, then: nginx -t && systemctl reload nginx
#
# The frontend container (nginx inside Docker) serves the SPA and proxies
# /backend/* to the backend container. Host nginx only terminates TLS and
# forwards everything to 127.0.0.1:8081.

server {
    listen 80;
    server_name tournament.schooltech.ru;

    # Uncomment after certbot, or use: certbot --nginx -d tournament.schooltech.ru
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/tournament.schooltech.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tournament.schooltech.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # websocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
