name: tournament-local

# Dev environment: provides only the database (with migrations applied).
# The Go server and the Vite frontend run on the host for hot reload:
#
#   terminal 1: docker compose -f docker-compose.local.yml up -d
#   terminal 2: cd backend && go run ./cmd/server          # uses config-yaml/local.yaml
#   terminal 3: cd frontend && deno task dev               # http://localhost:5173

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-root}
      POSTGRES_DB: ${DB_NAME:-tournamentDB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tournamentDB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build: ./backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DSN: postgres://${DB_USER:-postgres}:${DB_PASS:-root}@db:5432/${DB_NAME:-tournamentDB}
    command: ["/app/bin/migrator", "-migration-path", "/app/migrations", "up"]

volumes:
  pgdata:
