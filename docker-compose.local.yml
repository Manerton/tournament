name: tournament-local

# Dev environment: database (with migrations) + backend packed in Docker.
# The Vite frontend still runs on the host for hot reload:
#
#   terminal 1: docker compose -f docker-compose.local.yml up -d --build
#   terminal 2: cd frontend && deno task dev               # http://localhost:5173

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-root}
      POSTGRES_DB: ${DB_NAME:-tournamentDB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tournamentDB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build: ./backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DSN: postgres://${DB_USER:-postgres}:${DB_PASS:-root}@db:5432/${DB_NAME:-tournamentDB}
    command: ["/app/bin/migrator", "-migration-path", "/app/migrations", "up"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config-yaml/local-docker.yaml
    volumes:
      - ./backend/config-yaml/local-docker.yaml:/app/config-yaml/local-docker.yaml:ro
    ports:
      - "8080:8080"

volumes:
  pgdata:
